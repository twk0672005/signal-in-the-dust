<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A quiet first-person rover expedition. Approach a living alien signal and make first contact. 繁體中文 / English.">
<meta name="theme-color" content="#10171d">
<title>$GODOT_PROJECT_NAME</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2310171d'/%3E%3Cpath d='M15 35V18l9-8 9 8v17M24 18v17' fill='none' stroke='%23d2ac73' stroke-width='3'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10171d;color:#eee8dc;font-family:Inter,'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}button{font:inherit;cursor:pointer;border:1px solid #cfa96a;background:#cfa96a;color:#15191b;padding:13px 24px;min-height:48px;border-radius:3px}button:focus-visible{outline:3px solid #f8ecd4;outline-offset:5px}#veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#10171d;z-index:10;padding:24px}#card{width:min(480px,100%)}.eyebrow{font-size:13px;letter-spacing:.18em;color:#cfa96a;margin-bottom:22px}h1{font-size:clamp(34px,5vw,52px);line-height:1.08;font-weight:450;letter-spacing:-.045em;margin:0 0 22px}p{font-size:16px;line-height:1.65;color:#b9bdba}progress{display:block;accent-color:#cfa96a;width:100%;height:4px;margin:30px 0 16px;border:0;background:#323a3d}#status{min-height:2.6em}#retry{display:none}#technical{font-size:13px;color:#979e9e;overflow-wrap:anywhere}#technical:empty{display:none}.hidden{display:none!important}noscript{position:fixed;inset:0;background:#10171d;padding:10vh 10vw;z-index:20}a{color:#d2ac73}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body data-phase="loading">
<canvas id="canvas" tabindex="0" aria-label="Signal in the Dust exploration game"></canvas>
<noscript>JavaScript is required to play. / 請啟用 JavaScript 以開始探索。</noscript>
<section id="veil" aria-label="Loading"><div id="card"><div class="eyebrow">FIRST CONTACT · 首次接觸</div><h1>Signal<br>in the Dust</h1><p id="intro"></p><progress id="progress" aria-label="Loading progress"></progress><p id="status" role="status" aria-live="polite"></p><button id="retry" type="button"></button><p id="technical"></p></div></section>
<script src="$GODOT_URL"></script>
<script>
'use strict';
const config=$GODOT_CONFIG;
const zh=/^zh/i.test(navigator.language);
const copy=zh?{intro:'駕駛一輛小小的探測車，聆聽塵土下的回聲。',loading:'正在準備遠征…',compile:'正在喚醒探測車…',retry:'重新載入',error:'遠征暫時未能啟動。請重新載入再試。',support:'此瀏覽器未能提供所需的 3D 圖像支援。請使用已啟用硬件加速的桌面瀏覽器。',mobile:'這段遠征需要鍵盤與滑鼠。請在桌面電腦開啟此連結，探索四個外星地區。',lost:'圖像連線已中斷。重新載入即可開始新的遠征。'}:{intro:'A small rover. A living signal beneath the dust.',loading:'Preparing the expedition…',compile:'Waking the rover…',retry:'Reload expedition',error:'The expedition could not start. Reload to try again.',support:'This browser cannot provide the required 3D graphics. Use a desktop browser with hardware acceleration enabled.',mobile:'This expedition needs a keyboard and mouse. Open this link on a desktop computer to explore four alien regions.',lost:'The graphics connection was interrupted. Reload to begin a new expedition.'};
document.documentElement.lang=zh?'zh-Hant':'en';
const veil=document.getElementById('veil'),progress=document.getElementById('progress'),status=document.getElementById('status'),retry=document.getElementById('retry');
document.getElementById('intro').textContent=copy.intro;status.textContent=copy.loading;retry.textContent=copy.retry;retry.addEventListener('click',()=>location.reload());
window.__EXPEDITION_ERRORS__=[];
function fail(message,error){document.body.dataset.phase='error';veil.classList.remove('hidden');progress.classList.add('hidden');status.textContent=message;retry.style.display='inline-block';if(error){window.__EXPEDITION_ERRORS__.push(String(error));console.error(error);}}
const touchOnly=matchMedia('(pointer:coarse)').matches && !matchMedia('(hover:hover)').matches;
const mobile=touchOnly || Math.min(innerWidth,innerHeight)<700;
if(mobile){progress.classList.add('hidden');status.textContent=copy.mobile;document.body.dataset.phase='desktop_required';}
else if(typeof Engine==='undefined'||Engine.getMissingFeatures({threads:false}).length){fail(copy.support);}
else{
 // Sites may serve precompressed bytes without honoring _headers. Decode only
 // this engine asset, then restore fetch after startup. Raw exports also work.
 const originalFetch=window.fetch.bind(window);
 const wasmUrl=new URL(config.executable+'.wasm',location.href).href;
 window.fetch=async function(resource,options){
  const response=await originalFetch(resource,options);
  const requested=new URL(resource instanceof Request?resource.url:resource,location.href).href;
  if(requested!==wasmUrl||!response.ok)return response;
  const bytes=new Uint8Array(await response.arrayBuffer());
  const headers=new Headers({'Content-Type':'application/wasm'});
  if(bytes[0]===0x1f&&bytes[1]===0x8b){
   if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot decode the game package.');
   return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),{status:200,headers});
  }
  return new Response(bytes,{status:200,headers});
 };
 const engine=new Engine(config);
 const guard=setTimeout(()=>fail(copy.error,'startup timeout'),90000);
 engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;status.textContent=current>=total?copy.compile:copy.loading;}else progress.removeAttribute('value');},onPrintError:(...args)=>{const message=args.join(' ');window.__EXPEDITION_ERRORS__.push(message);console.error(message);}}).then(()=>{clearTimeout(guard);window.fetch=originalFetch;veil.classList.add('hidden');document.getElementById('canvas').focus();}).catch(error=>{clearTimeout(guard);window.fetch=originalFetch;fail(copy.error,error);});
 document.getElementById('canvas').addEventListener('webglcontextlost',()=>fail(copy.lost));
 document.getElementById('canvas').addEventListener('contextmenu',event=>event.preventDefault());
}
</script>
</body></html>
