*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10171d;color:#eee8dc;font-family:Inter,'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}button{font:inherit;cursor:pointer;border:1px solid #cfa96a;background:#cfa96a;color:#15191b;padding:13px 24px;min-height:48px;border-radius:3px}button:focus-visible{outline:3px solid #f8ecd4;outline-offset:5px}#veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#10171d;z-index:10;padding:24px}#card{width:min(480px,100%)}.eyebrow{font-size:13px;letter-spacing:.18em;color:#cfa96a;margin-bottom:22px}h1{font-size:clamp(34px,5vw,52px);line-height:1.08;font-weight:450;letter-spacing:-.045em;margin:0 0 22px}p{font-size:16px;line-height:1.65;color:#b9bdba}progress{display:block;accent-color:#cfa96a;width:100%;height:4px;margin:30px 0 16px;border:0;background:#323a3d}#status{min-height:2.6em}#retry{display:none}#technical{font-size:13px;color:#979e9e;overflow-wrap:anywhere}#technical:empty{display:none}.hidden{display:none!important}noscript{position:fixed;inset:0;background:#10171d;padding:10vh 10vw;z-index:20}a{color:#d2ac73}

<script>
/* Touch adapter: normal player actions, pointer-owned holds, no save/state mutation. */
(() => {
  const mobile = matchMedia('(pointer:coarse)').matches && !matchMedia('(hover:hover)').matches;

  if (!mobile) return;
  const canvas = document.getElementById('canvas');
  const panel = document.createElement('nav'); panel.id='touch-controls'; panel.setAttribute('aria-label','Touch controls');
  const groups=[['tools',[['expedition_journal','Journal','日誌'],['toggle_camera','View','視角'],['pause_mission','Pause','暫停']]],['steer',[['turn_left','◀','◀'],['turn_right','▶','▶']]],['pedals',[['drive_reverse','Reverse','倒車'],['brake','Brake','煞車'],['drive_forward','Drive','前進']]],['actions',[['interact','Observe · E','互動 · E'],['slow','Crawl','慢行']]],['tones',[['resonance_1','1','1'],['resonance_2','2','2'],['resonance_3','3','3']]]];
  const held=new Map(); let slow=false, locale='', lastPhase='';
  const continuous=new Set(['turn_left','turn_right','drive_forward','drive_reverse','brake']);
  function send(action,pressed,strength=1){ if(typeof window.expeditionTouch==='function')window.expeditionTouch(action,pressed,strength); }
  function release(id){const action=held.get(id);if(!action)return;held.delete(id);if(![...held.values()].includes(action))send(action,false);}
  function releaseAll(){for(const id of [...held.keys()])release(id);panel.querySelectorAll('button').forEach(b=>b.classList.remove('held'));}
  for(const [group,items] of groups){
    const row=document.createElement('div');row.className='touch-'+group;
    for(const [action,en,zh] of items){
      const b=document.createElement('button');b.type='button';b.dataset.action=action;b.dataset.en=en;b.dataset.zh=zh;b.textContent=en;b.setAttribute('aria-label',en);
      b.addEventListener('pointerdown',e=>{
        e.preventDefault();b.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});
        if(action==='slow'){slow=!slow;b.setAttribute('aria-pressed',String(slow));if([...held.values()].includes('drive_forward'))send('drive_forward',true,slow?.18:1);return;}
        if(continuous.has(action)){held.set(e.pointerId,action);b.classList.add('held');send(action,true,action==='drive_forward'&&slow?.18:1);}
        else{releaseAll();send(action,true);send(action,false);}
      });
      for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{release(e.pointerId);b.classList.remove('held');});
      row.appendChild(b);
    }panel.appendChild(row);
  }
  const rotate=document.createElement('div');rotate.id='rotate-phone';rotate.innerHTML='<div>↻<p>Rotate your phone to play<br>請將手機轉為橫向遊玩</p></div>';
  document.body.append(panel,rotate);
  const style=document.createElement('style');style.textContent=`
  canvas{touch-action:none}#touch-controls{position:fixed;inset:0;z-index:5;pointer-events:none;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #touch-controls>div{position:absolute;display:flex;gap:8px}#touch-controls button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;min-width:54px;min-height:50px;padding:8px;border:1px solid #b69c73;background:#111d26dc;color:#f4ead9;font-size:14px;border-radius:12px}#touch-controls button.held,#touch-controls button[aria-pressed=true]{background:#bd9558;color:#10171d}
  .touch-tools{right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}.touch-steer{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom))}.touch-steer button{font-size:24px!important;width:66px;height:60px}.touch-pedals{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom))}.touch-pedals button{height:60px}.touch-actions{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom))}.touch-tones{right:14px;top:72px}
  #rotate-phone{display:none;position:fixed;inset:0;z-index:30;background:#10171df5;color:#e9d7b4;align-items:center;justify-content:center;text-align:center;font:48px system-ui}#rotate-phone p{font-size:20px;padding:24px}
  @media(orientation:portrait){#rotate-phone{display:flex}}
  @media(max-height:360px){#touch-controls button{min-height:44px}.touch-pedals button,.touch-steer button{height:50px}}
  `;document.head.appendChild(style);
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',()=>{releaseAll();if(document.hidden&&['arrival','exploring','contact'].includes(window.__EXPEDITION_STATE__?.phase)){send('pause_only',true);}});
  window.addEventListener('resize',()=>{releaseAll();if(innerHeight>innerWidth&&['arrival','exploring','contact'].includes(window.__EXPEDITION_STATE__?.phase)){send('pause_only',true);}});
  setInterval(()=>{
    const s=window.__EXPEDITION_STATE__;if(!s)return;
    if(lastPhase!==s.phase){releaseAll();lastPhase=s.phase;}
    panel.style.display=['exploring','contact'].includes(s.phase)?'block':'none';
    panel.querySelector('.touch-tones').style.display=s.resonance?.phase==='answer'||s.resonance?.phase==='listening'?'flex':'none';
    if(locale!==s.settings?.locale){locale=s.settings?.locale;for(const b of panel.querySelectorAll('button'))b.textContent=locale==='zh_TW'?b.dataset.zh:b.dataset.en;}
  },100);
})();

else{
 // Sites may serve precompressed bytes without honoring _headers. Decode only

 const originalFetch=window.fetch.bind(window);
 const wasmUrl=new URL(config.executable+'.wasm',location.href).href;
 window.fetch=async function(resource,options){
  const response=await originalFetch(resource,options);
  const requested=new URL(resource instanceof Request?resource.url:resource,location.href).href;
  if(requested!==wasmUrl||!response.ok)return response;
  const bytes=new Uint8Array(await response.arrayBuffer());
  const headers=new Headers({'Content-Type':'application/wasm'});
  if(bytes[0]===0x1f&&bytes[1]===0x8b){
   if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot decode the game package.');
   return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),{status:200,headers});
  }
  return new Response(bytes,{status:200,headers});
 };

 const guard=setTimeout(()=>fail(copy.error,'startup timeout'),90000);
 engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;status.textContent=current>=total?copy.compile:copy.loading;}else progress.removeAttribute('value');},onPrintError:(...args)=>{const message=args.join(' ');window.__EXPEDITION_ERRORS__.push(message);console.error(message);}}).then(()=>{clearTimeout(guard);window.fetch=originalFetch;veil.classList.add('hidden');document.getElementById('canvas').focus();}).catch(error=>{clearTimeout(guard);window.fetch=originalFetch;fail(copy.error,error);});
 document.getElementById('canvas').addEventListener('webglcontextlost',()=>fail(copy.lost));
